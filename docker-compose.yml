version: '3.8'

services:
  # 1. MySQL Database Container
  db:
    image: mysql:8.0
    container_name: food_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: israel@200618
      MYSQL_DATABASE: food_ordering_db
    ports:
      - "3307:3306"
    volumes:
      # This automatically runs your SQL file on startup!
      - ./database/database.sql:/docker-entrypoint-initdb.d/init.sql
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # 2. Spring Boot Backend Container
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: food_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/food_ordering_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: israel@200618
    depends_on:
      db:
        condition: service_healthy # Waits for DB to be fully ready before starting Java

  # 3. Vanilla Frontend Web Server
  frontend:
    image: nginx:alpine
    container_name: food_frontend
    restart: always
    ports:
      - "80:80"
    volumes:
      # Mounts your frontend folder directly into the web server
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend

volumes:
  db_data: # Makes sure your database data isn't lost if the container stops