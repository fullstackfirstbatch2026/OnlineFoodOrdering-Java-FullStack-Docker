<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f97316">
    <title>Sign up | Docker Eats</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="site-nav"></header>
<main class="auth-wrap">
  <div class="card auth-card">
    <h1>Create your account</h1>
    <p class="sub">Join us to start ordering your favourite meals.</p>
    <form id="register-form" onsubmit="handleRegister(event)">
      <div class="form-error" id="auth-message" role="alert"></div>
      <div class="form-group"><label for="name">Full name</label><input type="text" id="name" class="form-control" placeholder="John Doe" autocomplete="name" required></div>
      <div class="form-group"><label for="email">Email</label><input type="email" id="email" class="form-control" placeholder="john@example.com" autocomplete="email" required></div>
      <div class="form-group"><label for="password">Password</label>
        <div class="pw-wrap"><input type="password" id="password" class="form-control" placeholder="At least 6 characters" autocomplete="new-password" required>
        <button type="button" class="pw-toggle" onclick="togglePw('password', this)">Show</button></div></div>
      <div class="form-group"><label for="confirm-password">Confirm password</label><input type="password" id="confirm-password" class="form-control" placeholder="••••••••" autocomplete="new-password" required></div>
      <button type="submit" class="btn btn-primary btn-block" id="register-btn">Sign up</button>
    </form>
    <p class="auth-foot">Already have an account? <a href="login.html">Log in</a></p>
  </div>
</main>

<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
