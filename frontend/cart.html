<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f97316">
    <title>Your Cart | Docker Eats</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="site-nav"></header>
<main class="container">
  <div class="page-head"><h1>Your cart</h1><p>Review your items before checking out.</p></div>
  <div class="cart-layout">
    <section>
      <div class="card cart-list" id="cart-items-container"></div>
      <button class="btn btn-ghost btn-sm" id="clear-cart" onclick="clearCart()" style="margin-top:14px">Clear cart</button>
    </section>
    <aside class="card summary">
      <h3>Order summary</h3>
      <div class="from-restaurant" id="cart-from" style="display:none"></div>
      <div class="summary-row"><span>Subtotal</span><span id="cart-subtotal">$0.00</span></div>
      <div class="summary-row total"><span>Total</span><span id="cart-total">$0.00</span></div>
      <button id="checkout-btn" class="btn btn-primary btn-block" onclick="submitOrder()" style="margin-top:20px">Place order</button>
      <a href="restaurants.html" class="btn btn-ghost btn-block" style="margin-top:10px">Keep browsing</a>
    </aside>
  </div>
</main>
<footer id="site-footer"></footer>
<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script src="js/cart.js"></script>
</body>
</html>
