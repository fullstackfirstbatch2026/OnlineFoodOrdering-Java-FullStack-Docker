<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f97316">
    <title>Log in | Docker Eats</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="site-nav"></header>
<main class="auth-wrap">
  <div class="card auth-card">
    <h1>Welcome back 👋</h1>
    <p class="sub">Log in to satisfy your cravings.</p>
    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-error" id="auth-message" role="alert"></div>
      <div class="form-group"><label for="email">Email</label><input type="email" id="email" class="form-control" placeholder="john@example.com" autocomplete="email" required></div>
      <div class="form-group"><label for="password">Password</label>
        <div class="pw-wrap"><input type="password" id="password" class="form-control" placeholder="••••••••" autocomplete="current-password" required>
        <button type="button" class="pw-toggle" onclick="togglePw('password', this)">Show</button></div></div>
      <button type="submit" class="btn btn-primary btn-block" id="login-btn">Log in</button>
    </form>
    <p class="auth-foot">New here? <a href="register.html">Create an account</a></p>
  </div>
</main>

<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
